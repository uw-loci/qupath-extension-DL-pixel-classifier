[workspace]
channels = ["conda-forge", "pytorch"]
# Note: osx-64 (Intel Mac) removed -- pixi panics trying to cross-resolve
# git-based PyPI dependencies for osx-64 when running on Windows/ARM Mac.
# Intel Macs are not a supported target for this extension.
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.11.*"
pip = ">=23.0"
appose = ">=0.10.1"
numpy = ">=1.24.0,<2.0"
pillow = ">=10.0.0"
scikit-image = ">=0.21.0"
tifffile = ">=2023.7.0"
imagecodecs = ">=2023.7.0"
pydantic = ">=2.0.0"
# psutil powers the SSL pretraining preflight memory check. Without it,
# the dataset preloader cannot tell whether the host has enough RAM to
# hold all decoded tiles, and the safe fallback (disk streaming) kicks in.
psutil = ">=5.9.0"

# CPU VARIANT -- the default, because it installs anywhere. No
# [system-requirements] cuda entry and no pytorch-gpu target: requiring CUDA
# makes `pixi install` fail the __cuda check on every launch on a machine
# without an NVIDIA GPU, so the extension cannot start at all. See pixi-gpu.toml
# for the CUDA build, chosen in preferences.
pytorch = ">=2.1.0"
torchvision = ">=0.16.0"

[pypi-dependencies]
segmentation-models-pytorch = ">=0.3.3"
albumentations = ">=1.3.0"
# stringzilla is a transitive dependency (albumentations -> albucore ->
# stringzilla >=3.10.4), pinned here only to exclude 5.1.2. That release
# publishes Windows wheels for cp310, cp312, cp313 and cp314 but for cp311
# only win_arm64 -- and this environment pins Python 3.11. On win-64 the
# resolver therefore falls back to the sdist, and building it needs MSVC
# 14+, which no user of a QuPath extension is expected to have:
#   error: Microsoft Visual C++ 14.0 or greater is required
# That aborts `pixi install`, i.e. the environment cannot be created at all.
# Verified against PyPI: 4.6.1 through 5.1.1 all ship cp311 win_amd64.
stringzilla = ">=3.10.4,!=5.1.2"
# Optional: kornia enables GPU-side augmentation for faster training.
# The training path auto-falls back to albumentations (CPU) when kornia is
# unavailable, so this is safe to leave in but non-fatal if install fails.
kornia = ">=0.7.0"
timm = ">=1.0.0"
ttach = ">=0.0.3"
muvit = ">=0.1.0"
x-transformers = ">=1.0.0"
einops = ">=0.7.0"

# ONNX (optional, for exported models)
onnx = ">=1.15.0"
onnxruntime = ">=1.16.0"

# dlclassifier-server is installed separately via pip after the pixi
# environment is built (see ApposeService.java). Pixi's PyPI resolver
# panics on git-based subdirectory dependencies, so this is handled
# outside pixi to avoid the resolver entirely.
